<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StandOff</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0E0E10; --panel: #16161A; --panel-2: #1C1C20; --text: #F2F1ED; --text-dim: #8A8A90;
    --accent: #FF3D2E; --border: #26262B; --win: #4ADE80; --gold: #FFC94A; --silver: #C7CDD6; --bronze: #D98A5B;
    --tabbar-h: 64px; --topbar-h: 58px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  body { min-height: 100vh; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 6px 20px rgba(255,61,46,0.4); } 50% { box-shadow: 0 6px 28px rgba(255,61,46,0.75); } }
  @keyframes beltShine { 0% { background-position: -150% 0; } 100% { background-position: 250% 0; } }
  @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes toastIn { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes tabPop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes vsSlideLeft { to { transform: translateX(0); } }
  @keyframes vsSlideRight { to { transform: translateX(0); } }
  @keyframes vsFadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes vsBadgePop { 0% { transform: translate(-50%,-50%) scale(0) rotate(-20deg); } 60% { transform: translate(-50%,-50%) scale(1.15) rotate(6deg); } 100% { transform: translate(-50%,-50%) scale(1) rotate(0); } }
  @keyframes vsStampSlam { 0% { opacity: 0; transform: translate(-50%,-50%) scale(3) rotate(-8deg); } 60% { opacity: 1; transform: translate(-50%,-50%) scale(0.9) rotate(-8deg); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-8deg); } }
  @keyframes vsFlashPulse { 0% { opacity: 0; } 20% { opacity: 1; } 40% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes vsFadeOut { to { opacity: 0; } }
  @keyframes vsShake { 10%,90% { transform: translate3d(-2px,0,0); } 20%,80% { transform: translate3d(3px,0,0); } 30%,50%,70% { transform: translate3d(-5px,0,0); } 40%,60% { transform: translate3d(5px,0,0); } }
  @keyframes badgePop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  .auth-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .auth-logo { font-family: 'Archivo Black', sans-serif; font-size: 2rem; margin-bottom: 0.5rem; animation: popIn 0.5s ease; }
  .auth-logo span { color: var(--accent); }
  .auth-sub { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 2rem; max-width: 300px; }
  .auth-form { width: 100%; max-width: 320px; }

  input[type="email"], input[type="text"], input[type="number"], input[type="password"], textarea, select {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 0.95rem; padding: 0.85rem 1rem;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    outline: none; margin-bottom: 0.75rem; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,61,46,0.15); }
  input[type="file"] { border: 1px dashed var(--border); padding: 0.7rem; font-size: 0.82rem; color: var(--text-dim); }

  .btn { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.95rem; padding: 0.85rem 1.25rem; border-radius: 8px; border: none; cursor: pointer; width: 100%; transition: opacity 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease; }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { box-shadow: 0 4px 16px rgba(255,61,46,0.4); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-sm { padding: 0.55rem 0.9rem; font-size: 0.78rem; width: auto; }
  .btn-danger { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .status-msg { font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2rem; }
  .status-msg.success { color: var(--win); }
  .status-msg.error { color: var(--accent); animation: popIn 0.25s ease; }

  .auth-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .topbar { position: sticky; top: 0; z-index: 20; height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; padding: 0 1.1rem; background: rgba(14,14,16,0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); gap: 0.6rem; }
  .topbar-logo { font-family: 'Archivo Black', sans-serif; font-size: 1.1rem; }
  .topbar-logo span { color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 0.6rem; margin-left: auto; }
  .bell-btn { position: relative; width: 34px; height: 34px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: transform 0.12s ease; }
  .bell-btn:active { transform: scale(0.9); }
  .bell-badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; animation: badgePop 0.3s ease; }
  .profile-avatar-btn { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FF3D2E, #B8281C); border: none; cursor: pointer; color: #fff; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; transition: transform 0.12s ease; overflow: hidden; }
  .profile-avatar-btn:active { transform: scale(0.9); }
  .profile-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

  .notif-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; margin-bottom: 0.6rem; position: relative; }
  .notif-item.unread { border-color: var(--accent); background: rgba(255,61,46,0.06); }
  .notif-item.unread::before { content: ''; position: absolute; top: 0.9rem; left: -1px; width: 3px; height: calc(100% - 1.8rem); background: var(--accent); border-radius: 0 3px 3px 0; }
  .notif-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.2rem; }
  .notif-body { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; margin-bottom: 0.4rem; }
  .notif-time { font-size: 0.65rem; color: var(--text-dim); }
  .notif-action { margin-top: 0.5rem; }

  .content { padding: 1rem 1.1rem; padding-bottom: calc(var(--tabbar-h) + 4.5rem); min-height: calc(100vh - var(--topbar-h)); }

  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.9rem; }
  .section-title { font-family: 'Archivo Black', sans-serif; font-size: 1rem; }
  .section-sub { font-size: 0.72rem; color: var(--text-dim); }

  .empty-state { text-align: center; color: var(--text-dim); padding: 3rem 1rem; font-size: 0.9rem; }
  .loading-dots { display: inline-flex; gap: 0.3rem; }
  .loading-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: dotBounce 1.2s infinite ease-in-out; }
  .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
  .fade-item { animation: fadeInUp 0.35s ease both; }

  .belt-card { background: linear-gradient(135deg, #1c1710, #16161A); border: 1px solid #3a2e12; border-radius: 12px; padding: 0.9rem; margin-bottom: 0.7rem; position: relative; display: flex; align-items: center; gap: 0.75rem; overflow: hidden; transition: transform 0.15s ease; }
  .belt-card:active { transform: scale(0.98); }
  .belt-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(100deg, transparent 40%, rgba(255,201,74,0.18) 50%, transparent 60%); background-size: 200% 100%; animation: beltShine 3.5s ease-in-out infinite; pointer-events: none; }
  .belt-icon { font-size: 1.6rem; flex-shrink: 0; width: 44px; height: 44px; background: rgba(255,201,74,0.1); border: 1px solid var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; overflow: hidden; }
  .belt-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
  .belt-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .belt-category { font-size: 0.65rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.15rem; }
  .belt-champ { font-weight: 700; font-size: 0.85rem; }
  .belt-item { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 0.3rem; }
  .belt-defense { font-size: 0.65rem; color: var(--text-dim); display: inline-block; background: var(--panel-2); padding: 0.15rem 0.45rem; border-radius: 10px; }
  .belt-defense.untested { color: var(--gold); border: 1px solid var(--gold); background: transparent; }
  .belt-challenge-btn { flex-shrink: 0; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.72rem; font-weight: 700; cursor: pointer; position: relative; z-index: 1; }

  .post-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 0.9rem; position: relative; transition: transform 0.15s ease, border-color 0.15s ease; }
  .post-card:hover { border-color: #3a3a40; transform: translateY(-1px); }

  .gallery { position: relative; height: 200px; background: linear-gradient(135deg, #24242a, #17171b); overflow: hidden; }
  .gallery-track { display: flex; height: 100%; transition: transform 0.3s ease; touch-action: pan-y; }
  .gallery-frame { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--text-dim); }
  .gallery-frame img, .gallery-frame video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .gallery-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: rgba(14,14,16,0.65); color: #fff; border: none; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3; }
  .gallery-arrow.prev { left: 0.6rem; }
  .gallery-arrow.next { right: 0.6rem; }
  .gallery-dots { position: absolute; bottom: 0.6rem; left: 0; right: 0; display: flex; justify-content: center; gap: 0.35rem; z-index: 3; }
  .gallery-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: background 0.15s ease, transform 0.15s ease; }
  .gallery-dot.active { background: #fff; transform: scale(1.3); }

  .post-body { padding: 0.8rem 0.95rem 0.95rem; }
  .post-user { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.2rem; }
  .post-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.3rem; }
  .post-desc { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.7rem; line-height: 1.4; }
  .post-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip { font-size: 0.72rem; font-weight: 600; padding: 0.35rem 0.65rem; border-radius: 20px; background: var(--panel-2); color: var(--text-dim); border: none; cursor: pointer; }
  .chip-callout { background: var(--accent); color: #fff; }
  .chip-buy { background: var(--win); color: #0E0E10; font-weight: 700; }

  .sample-badge { position: absolute; top: 0.7rem; right: 0.7rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.25rem 0.5rem; border-radius: 5px; background: rgba(14,14,16,0.85); border: 1px solid var(--text-dim); color: var(--text-dim); z-index: 4; }
  .sponsor-badge { position: absolute; top: 0.7rem; right: 0.7rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.25rem 0.5rem; border-radius: 5px; background: rgba(255,201,74,0.15); border: 1px solid var(--gold); color: var(--gold); z-index: 4; }

  .arena-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.9rem; position: relative; transition: transform 0.15s ease; }
  .arena-card:hover { transform: translateY(-1px); }
  .arena-element { font-size: 0.7rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.6rem; padding-right: 4.5rem; }
  .arena-timer { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 0.6rem; }
  .arena-timer.urgent { color: var(--accent); font-weight: 700; animation: dotBounce 1.4s infinite; }
  .arena-matchup { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.7rem; }
  .arena-side { flex: 1; text-align: center; }
  .arena-thumb { width: 100%; height: 84px; border-radius: 8px; background: linear-gradient(135deg, #24242a, #17171b); margin-bottom: 0.4rem; overflow: hidden; }
  .arena-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .arena-side-name { font-size: 0.72rem; color: var(--text-dim); }
  .arena-vs { font-family: 'Archivo Black', sans-serif; font-size: 0.78rem; color: var(--accent); width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .vote-bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; display: flex; margin-bottom: 0.4rem; }
  .vote-fill-a { background: var(--accent); transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  .vote-fill-b { background: #3a3a40; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  .vote-meta { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 0.6rem; }
  .vote-actions { display: flex; gap: 0.5rem; }
  .vote-btn { flex: 1; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-weight: 700; font-size: 0.8rem; cursor: pointer; }
  .vote-btn:disabled { opacity: 0.4; cursor: default; }
  .voted-tag { font-size: 0.75rem; color: var(--win); text-align: center; font-weight: 700; animation: popIn 0.35s ease; }

  .lb-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.6rem; border-radius: 10px; margin-bottom: 0.4rem; background: var(--panel); border: 1px solid var(--border); }
  .lb-row.me { border-color: var(--accent); background: rgba(255,61,46,0.08); }
  .lb-rank { font-family: 'Archivo Black', sans-serif; font-size: 0.95rem; color: var(--text-dim); width: 28px; text-align: center; flex-shrink: 0; }
  .lb-rank.gold { color: var(--gold); text-shadow: 0 0 12px rgba(255,201,74,0.6); }
  .lb-rank.silver { color: var(--silver); }
  .lb-rank.bronze { color: var(--bronze); }
  .lb-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FF3D2E, #B8281C); flex-shrink: 0; overflow: hidden; }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-weight: 700; font-size: 0.85rem; }
  .lb-tier { font-size: 0.65rem; color: var(--accent); font-weight: 600; text-transform: uppercase; }
  .lb-score { text-align: right; }
  .lb-score-num { font-family: 'Archivo Black', sans-serif; font-size: 0.9rem; }
  .lb-score-label { font-size: 0.6rem; color: var(--text-dim); }

  .profile-head { text-align: center; padding: 1rem 0 1.2rem; animation: popIn 0.4s ease; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #FF3D2E, #B8281C); margin: 0 auto 0.6rem; cursor: pointer; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 1.6rem; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-edit-hint { font-size: 0.65rem; color: var(--text-dim); margin-top: -0.3rem; margin-bottom: 0.6rem; }
  .profile-name { font-weight: 700; font-size: 1.05rem; }
  .profile-rank { font-size: 0.78rem; color: var(--accent); font-weight: 700; margin-top: 0.15rem; }
  .stat-row { display: flex; justify-content: space-around; padding: 1rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
  .stat { text-align: center; }
  .stat-num { font-family: 'Archivo Black', sans-serif; font-size: 1.15rem; }
  .stat-label { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.1rem; }
  .record-row { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 0.1rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .record-result { font-weight: 700; font-size: 0.7rem; padding: 0.25rem 0.55rem; border-radius: 6px; }
  .win-tag { background: rgba(255,61,46,0.15); color: var(--accent); }
  .loss-tag { background: var(--panel-2); color: var(--text-dim); }
  .share-btn { margin-top: 1.5rem; }
  .logout-btn { margin-top: 0.75rem; }

  .order-row, .listing-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; margin-bottom: 0.5rem; }
  .order-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 0.2rem; }
  .order-meta { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 0.5rem; }
  .order-tag { display: inline-block; font-size: 0.62rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 10px; text-transform: uppercase; }
  .order-tag.held { background: rgba(255,201,74,0.15); color: var(--gold); }
  .order-tag.released { background: rgba(74,222,128,0.15); color: var(--win); }
  .order-tag.active { background: rgba(255,61,46,0.15); color: var(--accent); }
  .listing-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .listing-actions button { flex: 1; padding: 0.5rem; font-size: 0.72rem; }
  .payout-banner { background: rgba(255,201,74,0.08); border: 1px solid var(--gold); border-radius: 10px; padding: 0.8rem; margin-bottom: 1rem; font-size: 0.8rem; }
  .payout-banner button { margin-top: 0.6rem; }

  .market-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.9rem; }
  .market-price { font-family: 'Archivo Black', sans-serif; font-size: 1.3rem; color: var(--win); margin: 0.4rem 0; }
  .market-bid-row { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .market-bid-row input { margin-bottom: 0; flex: 1; }
  .auction-timer { font-size: 0.72rem; color: var(--text-dim); }
  .auction-timer.urgent { color: var(--accent); font-weight: 700; }
  .sell-type-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  .sell-type-btn { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); font-size: 0.78rem; font-weight: 600; cursor: pointer; }
  .sell-type-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,61,46,0.08); }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: var(--tabbar-h); display: flex; border-top: 1px solid var(--border); background: rgba(14,14,16,0.95); backdrop-filter: blur(8px); z-index: 20; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; font-size: 0.58rem; color: var(--text-dim); font-weight: 700; background: none; border: none; cursor: pointer; position: relative; }
  .tab-icon { font-size: 1.15rem; }
  .tab.active { color: var(--accent); }
  .tab.active .tab-icon { animation: tabPop 0.35s ease; }
  .tab-indicator { position: absolute; top: 0; left: 20%; right: 20%; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent); transform: scaleX(0); transition: transform 0.2s ease; }
  .tab.active .tab-indicator { transform: scaleX(1); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: flex-end; justify-content: center; z-index: 50; opacity: 0; transition: opacity 0.2s ease; }
  .modal-overlay.open { display: flex; opacity: 1; }
  .modal { background: var(--panel); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 1.5rem 1.25rem 2rem; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; animation: fadeInUp 0.25s ease; }
  .modal-title { font-family: 'Archivo Black', sans-serif; font-size: 1.1rem; margin-bottom: 1rem; }
  .modal-close { float: right; background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; }

function galleryHtml(mediaArr) {
  const items = (mediaArr || []).slice().sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
  if (!items.length) return `<div class="gallery"><div class="gallery-frame">Photo</div></div>`;
  const frames = items.map(m => m.type === 'video'
    ? `<div class="gallery-frame"><video src="${m.url}" muted playsinline loop controls></video></div>`
    : `<div class="gallery-frame"><img src="${m.url}" loading="lazy" /></div>`
  ).join('');
  const dots = items.length > 1 ? `<div class="gallery-dots">${items.map((_,i) => `<div class="gallery-dot ${i===0?'active':''}"></div>`).join('')}</div>` : '';
  const arrows = items.length > 1 ? `<button class="gallery-arrow prev">‹</button><button class="gallery-arrow next">›</button>` : '';
  return `<div class="gallery" data-count="${items.length}" data-index="0"><div class="gallery-track">${frames}</div>${arrows}${dots}</div>`;
}

function wireGalleries(root) {
  root.querySelectorAll('.gallery').forEach(gal => {
    const count = Number(gal.dataset.count || 1);
    if (count <= 1) return;
    const track = gal.querySelector('.gallery-track');
    const dots = gal.querySelectorAll('.gallery-dot');
    function goTo(i) {
      const idx = Math.max(0, Math.min(count - 1, i));
      gal.dataset.index = idx;
      track.style.transform = `translateX(-${idx * 100}%)`;
      dots.forEach((d, di) => d.classList.toggle('active', di === idx));
    }
    const prev = gal.querySelector('.gallery-arrow.prev');
    const next = gal.querySelector('.gallery-arrow.next');
    if (prev) prev.addEventListener('click', (e) => { e.stopPropagation(); goTo(Number(gal.dataset.index) - 1); });
    if (next) next.addEventListener('click', (e) => { e.stopPropagation(); goTo(Number(gal.dataset.index) + 1); });
    let startX = 0;
    track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) goTo(Number(gal.dataset.index) + (dx < 0 ? 1 : -1));
    }, { passive: true });
  });
}

function formatTimeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  return Math.floor(hours / 24) + 'd ago';
}

function openPostModal(existingPost) {
  const isEdit = !!existingPost;
  modalContent.innerHTML = `

    <div class="modal-title">${isEdit ? 'Edit listing' : 'Post something'}</div>
    <select id="new-category">
      <option value="Cars">Cars</option>
      <option value="Homes">Homes</option>
      <option value="Motorcycles">Motorcycles</option>
      <option value="Timepieces">Timepieces</option>
      <option value="Custom Gear">Custom Gear</option>

    <input type="text" id="new-title" placeholder="Title (e.g. '69 Camaro SS)" value="${isEdit ? escapeHtml(existingPost.title) : ''}" />
    <textarea id="new-desc" rows="3" placeholder="Description">${isEdit ? escapeHtml(existingPost.description || '') : ''}</textarea>
    <input type="file" id="new-photos" accept="image/*,video/*" multiple />
    <div class="sell-type-row">
      <button type="button" class="sell-type-btn ${!isEdit || !existingPost.for_sale ? 'active' : ''}" data-sell="none">Not for sale</button>
      <button type="button" class="sell-type-btn ${isEdit && existingPost.for_sale ? 'active' : ''}" data-sell="buy">Buy Now</button>
      ${isEdit ? '' : '<button type="button" class="sell-type-btn" data-sell="auction">Auction</button>'}
    </div>
    <input type="number" id="new-price" placeholder="Price in USD" value="${isEdit && existingPost.price_cents ? (existingPost.price_cents/100) : ''}" style="display:${isEdit && existingPost.for_sale ? 'block' : 'none'};" />
    <input type="number" id="auction-duration" placeholder="Auction length in hours (e.g. 48)" style="display:none;" />
    <button class="btn btn-primary" id="new-submit">${isEdit ? 'Save changes' : 'Post it'}</button>
    <div class="status-msg" id="new-msg"></div>
  `;
  modalOverlay.classList.add('open');
  let sellType = isEdit && existingPost.for_sale ? 'buy' : 'none';
  if (isEdit) document.getElementById('new-category').value = existingPost.category;
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.querySelectorAll('.sell-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sell-type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sellType = btn.dataset.sell;
      document.getElementById('new-price').style.display = (sellType === 'buy' || sellType === 'auction') ? 'block' : 'none';
      document.getElementById('new-price').placeholder = sellType === 'auction' ? 'Starting price in USD' : 'Price in USD';
      const durInput = document.getElementById('auction-duration');
      if (durInput) durInput.style.display = sellType === 'auction' ? 'block' : 'none';
    });
  });
  document.getElementById('new-submit').addEventListener('click', async () => {
    const title = document.getElementById('new-title').value.trim();
    const description = document.getElementById('new-desc').value.trim();
    const category = document.getElementById('new-category').value;
    const priceVal = document.getElementById('new-price').value;
    const durationInput = document.getElementById('auction-duration');
    const durationVal = durationInput ? durationInput.value : '';
    const files = Array.from(document.getElementById('new-photos').files || []);
    const msg = document.getElementById('new-msg');
    const submitBtn = document.getElementById('new-submit');
    if (!title) { msg.textContent = 'Title is required.'; msg.className = 'status-msg error'; return; }
    if ((sellType === 'buy' || sellType === 'auction') && (!priceVal || Number(priceVal) <= 0)) {
      msg.textContent = 'Enter a valid price.'; msg.className = 'status-msg error'; return;
    }

    submitBtn.disabled = true; submitBtn.textContent = isEdit ? 'Saving...' : 'Posting...';
    let postId = existingPost?.id;

    if (isEdit) {
      const updatePayload = { title, description, category };
      updatePayload.for_sale = sellType === 'buy';
      updatePayload.price_cents = sellType === 'buy' ? Math.round(Number(priceVal) * 100) : null;
      const { error } = await sb.from('posts').update(updatePayload).eq('id', postId);
      if (error) { msg.textContent = error.message; msg.className = 'status-msg error'; submitBtn.disabled = false; submitBtn.textContent = 'Save changes'; return; }
    } else {
      const insertPayload = { user_id: session.user.id, title, description, category };
      if (sellType === 'buy') { insertPayload.for_sale = true; insertPayload.price_cents = Math.round(Number(priceVal) * 100); }
      const { data: newPost, error } = await sb.from('posts').insert(insertPayload).select('id').single();
      if (error) { msg.textContent = error.message; msg.className = 'status-msg error'; submitBtn.disabled = false; submitBtn.textContent = 'Post it'; return; }
      postId = newPost.id;
    }

    if (files.length) {
      submitBtn.textContent = 'Uploading media...';
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const isVideo = file.type.startsWith('video');
        const path = `${session.user.id}/${postId}/${Date.now()}-${i}-${file.name}`;
        const { error: upErr } = await sb.storage.from('post-media').upload(path, file);
        if (upErr) { showToast('One file failed to upload: ' + upErr.message, true); continue; }
        const { data: pub } = sb.storage.from('post-media').getPublicUrl(path);
        await sb.from('media').insert({ post_id: postId, url: pub.publicUrl, type: isVideo ? 'video' : 'image', sort_order: i });
      }
    }

    if (!isEdit && sellType === 'auction') {
      const hours = Number(durationVal) > 0 ? Number(durationVal) : 48;
      const { error: aErr } = await sb.from('auctions').insert({
        post_id: postId,
        seller_id: session.user.id,
        starting_price_cents: Math.round(Number(priceVal) * 100),
        ends_at: new Date(Date.now() + hours * 3600 * 1000).toISOString()
      });
      if (aErr) showToast('Posted, but auction could not start: ' + aErr.message, true);
    }

    closeModal();
    showToast(isEdit ? 'Listing updated!' : 'Posted! Someone can call you out now.');
    if (activeTab === 'record') loadRecord(); else loadFeed();
  });
}

async function buyNow(postId) {

  if (error || !data) { showToast('Checkout failed. Try again.', true); return; }

  if (data.url) window.location.href = data.url;
}

function formatTimeLeft(expiresAt) {
  const diffMs = new Date(expiresAt).getTime() - Date.now();
  if (diffMs <= 0) return { text: 'Closing now', urgent: true };
  const hours = Math.floor(diffMs / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);
  if (days >= 1) return { text: `${days}d ${hours % 24}h left`, urgent: false };
  const mins = Math.floor((diffMs / (1000 * 60)) % 60);
  return { text: `${hours}h ${mins}m left`, urgent: hours < 6 };
}

async function shareRecordCard() {
  const btn = document.getElementById('share-record-btn');
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Building your card...';
  try {
    await document.fonts.load('900 90px "Archivo Black"');
    await document.fonts.load('700 40px "Inter"');
    const wins = currentFinished.filter(c => c.winner_id === session.user.id).length;
    const losses = currentFinished.length - wins;
    const profile = currentProfile;
    const W = 1080, H = 1350;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0E0E10'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FF3D2E'; ctx.fillRect(0, 0, W, 14);
    ctx.textAlign = 'left';
    ctx.font = '900 64px "Archivo Black", sans-serif';
    const standW = ctx.measureText('Stand').width;
    const offW = ctx.measureText('Off').width;
    const totalW = standW + offW;
    ctx.fillStyle = '#F2F1ED'; ctx.fillText('Stand', W / 2 - totalW / 2, 130);
    ctx.fillStyle = '#FF3D2E'; ctx.fillText('Off', W / 2 - totalW / 2 + standW, 130);
    ctx.textAlign = 'center';
    ctx.font = '600 26px Inter, sans-serif'; ctx.fillStyle = '#8A8A90'; ctx.fillText('PROVE IT', W / 2, 175);
    ctx.beginPath(); ctx.arc(W / 2, 340, 90, 0, Math.PI * 2);
    const grad = ctx.createLinearGradient(W/2 - 90, 250, W/2 + 90, 430);
    grad.addColorStop(0, '#FF3D2E'); grad.addColorStop(1, '#B8281C');
    ctx.fillStyle = grad; ctx.fill();
    ctx.font = '900 44px "Archivo Black", sans-serif'; ctx.fillStyle = '#F2F1ED'; ctx.fillText('@' + profile.username, W / 2, 500);
    ctx.font = '700 30px Inter, sans-serif'; ctx.fillStyle = '#FF3D2E'; ctx.fillText(profile.rank.toUpperCase(), W / 2, 545);
    const statY = 700;
    const stats = [{ num: String(profile.score), label: 'SCORE' }, { num: String(profile.trophies), label: 'TROPHIES' }, { num: `${wins}-${losses}`, label: 'RECORD' }];
    const colW = W / 3;
    stats.forEach((s, i) => {
      const cx = colW * i + colW / 2;
      ctx.font = '900 68px "Archivo Black", sans-serif'; ctx.fillStyle = '#F2F1ED'; ctx.fillText(s.num, cx, statY);
      ctx.font = '700 24px Inter, sans-serif'; ctx.fillStyle = '#8A8A90'; ctx.fillText(s.label, cx, statY + 40);
    });
    ctx.strokeStyle = '#26262B'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(80, 780); ctx.lineTo(W - 80, 780); ctx.stroke();
    ctx.font = '700 30px Inter, sans-serif'; ctx.fillStyle = '#F2F1ED'; ctx.textAlign = 'left'; ctx.fillText('Recent Standoffs', 80, 850);
    let ry = 910;
    currentFinished.slice(0, 4).forEach(c => {
      const won = c.winner_id === session.user.id;
      const opponentTitle = c.challenger_id === session.user.id ? c.postB?.title : c.postA?.title;
      ctx.font = '600 26px Inter, sans-serif'; ctx.fillStyle = '#8A8A90';
      const label = 'vs. ' + (opponentTitle || 'Opponent');
      ctx.fillText(label.length > 34 ? label.slice(0, 34) + '…' : label, 80, ry);
      ctx.textAlign = 'right'; ctx.fillStyle = won ? '#FF3D2E' : '#8A8A90';
      ctx.font = '900 26px "Archivo Black", sans-serif'; ctx.fillText(won ? 'WON' : 'LOST', W - 80, ry);
      ctx.textAlign = 'left'; ry += 60;
    });
    ctx.textAlign = 'center';
    ctx.font = '700 28px Inter, sans-serif'; ctx.fillStyle = '#8A8A90'; ctx.fillText('standoffapp.com', W / 2, H - 60);
    ctx.font = '600 22px Inter, sans-serif'; ctx.fillText('Think you can stand up to this?', W / 2, H - 30);
    canvas.toBlob(async (blob) => {
      btn.disabled = false; btn.textContent = originalText;
      const file = new File([blob], 'standoff-record.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'My StandOff Record', text: `${profile.rank} — ${profile.score} pts — standoffapp.com` });
          showToast('Shared!');
        } catch (e) { if (e.name !== 'AbortError') showToast('Could not share.', true); }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'standoff-record.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('Saved! Post it to your story.');
      }
    }, 'image/png');
  } catch (e) {
    btn.disabled = false; btn.textContent = originalText;
    showToast('Could not build the share card.', true);
  }
}

function openChallengeModal(opponentPostId, opponentId) {
  modalContent.innerHTML = `
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-title">Call them out</div>
    <input type="text" id="challenge-element" placeholder="What are you settling? (e.g. Top Speed)" />
    <button class="btn btn-primary" id="challenge-submit">Send the challenge</button>
    <div class="status-msg" id="challenge-msg"></div>
  `;
  modalOverlay.classList.add('open');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('challenge-submit').addEventListener('click', async () => {
    const element = document.getElementById('challenge-element').value.trim();
    const msg = document.getElementById('challenge-msg');
    if (!element) { msg.textContent = 'Say what you\'re settling.'; msg.className = 'status-msg error'; return; }
    const { data: myPosts } = await sb.from('posts').select('id, title, media(url)').eq('user_id', session.user.id).limit(1);
    if (!myPosts || !myPosts.length) { msg.textContent = 'Post something of yours first.'; msg.className = 'status-msg error'; return; }
    const { data: opponentPostRow } = await sb.from('posts').select('title, media(url)').eq('id', opponentPostId).single();
    const { error } = await sb.from('challenges').insert({
      challenger_id: session.user.id, opponent_id: opponentId, post_a_id: opponentPostId,
      post_b_id: myPosts[0].id, bet_type: 'Gentleman', element
    });
    if (error) { msg.textContent = error.message; msg.className = 'status-msg error'; }
    else {
      closeModal();
      const leftImg = opponentPostRow?.media?.[0]?.url || '';
      const rightImg = myPosts[0].media?.[0]?.url || '';
      showVsIntro(opponentPostRow?.title || 'Opponent', leftImg, myPosts[0].title, rightImg, element, () => {
        showToast('Challenge sent! It\'s live in the Arena.');
        activeTab = 'arena';
        renderApp();
      });
    }
  });
}

function closeModal() { modalOverlay.classList.remove('open'); modalContent.innerHTML = ''; }

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

initAuth();
</script>
